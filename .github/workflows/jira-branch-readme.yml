name: Create Jira spec, implement with Claude, and open PR

on:
  create:

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  create-spec-implement-and-pr:
    name: Create Jira spec, implement with Claude Code, and open PR
    if: github.event.ref_type == 'branch'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Clone created branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.ref }}

      - name: Create README and spec from Jira issue
        env:
          BRANCH_NAME: ${{ github.event.ref }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
        run: node .github/scripts/jira-branch-automation.mjs prepare

      - name: Create plan and implement with Claude Code
        if: env.SHOULD_RUN == 'true'
        uses: anthropics/claude-code-base-action@beta
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            You are working on branch `${{ github.event.ref }}` of `${{ github.repository }}`.

            The repository has already been cloned and checked out to the created branch.
            Read the generated Jira spec file at `${{ env.SPEC_FILE }}` fully.
            First create an implementation plan and write it to exactly `${{ env.PLAN_FILE }}`.
            Then execute that plan by making the required repository changes on this branch.
            Do not edit README.md or the spec file.
            Do not create or merge pull requests yourself; the workflow will create the PR after your changes are committed.

            The plan must be markdown and include:
            - Summary of the requested change
            - Current workflow/script files to inspect
            - Proposed implementation steps
            - Secrets/configuration required
            - Testing plan
            - Risks and rollback notes
          allowed_tools: "Read,Write,Edit,MultiEdit,Glob,Grep,Bash(git status),Bash(git diff),Bash(ls),Bash(pwd),Bash(node --check *),Bash(npm test),Bash(npm run *)"
          max_turns: "12"

      - name: Commit generated and implemented files
        if: env.SHOULD_RUN == 'true'
        run: |
          # Claude Code base action may leave local execution artifacts; do not commit them.
          rm -f output.txt

          if [ ! -f "${PLAN_FILE}" ]; then
            echo "Expected plan file was not created: ${PLAN_FILE}" >&2
            exit 1
          fi

          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Implement ${ISSUE_KEY} from Jira"
          git push origin "HEAD:${{ github.event.ref }}"

      - name: Create pull request
        if: env.SHOULD_RUN == 'true'
        env:
          GH_TOKEN: ${{ secrets.GH_PR_TOKEN }}
        run: |
          repo_owner="${GITHUB_REPOSITORY%%/*}"
          existing_pr="$(gh api -X GET "repos/${GITHUB_REPOSITORY}/pulls?state=open&base=main&head=${repo_owner}:${BRANCH_NAME}" --jq '.[0].html_url // empty')"
          if [ -n "${existing_pr}" ]; then
            echo "PR_URL=${existing_pr}" >> "${GITHUB_ENV}"
            echo "Pull request already exists: ${existing_pr}"
            exit 0
          fi

          pr_body="$(cat <<EOF
          Automated Claude Code implementation for ${ISSUE_KEY}.

          Jira: ${JIRA_ISSUE_URL}
          Spec: ${SPEC_FILE}
          Plan: ${PLAN_FILE}

          Review and merge when ready.
          EOF
          )"

          pr_url="$(gh pr create \
            --base main \
            --head "${BRANCH_NAME}" \
            --title "${ISSUE_KEY}: ${ISSUE_TITLE}" \
            --body "${pr_body}")"

          echo "PR_URL=${pr_url}" >> "${GITHUB_ENV}"
          echo "Created pull request: ${pr_url}"

      - name: Comment on Jira issue
        if: env.SHOULD_RUN == 'true'
        env:
          BRANCH_NAME: ${{ github.event.ref }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
        run: node .github/scripts/jira-branch-automation.mjs comment
