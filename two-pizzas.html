<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Two Pizzas</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #fff7ec;
    --ink: #3a2412;
    --crust-outer: #c8852a;
    --crust-inner: #f5c073;
    --sauce: #c0341a;
    --cheese: #ffd766;
    --pepperoni: #a8201a;
    --pepperoni-shade: #6b1411;
    --basil: #2f7a2a;
    --basil-shade: #1f4f1d;
    --mozz: #fff8e7;
    --mozz-shade: #f0e0b8;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #1c140c; --ink: #f6e8d0; }
  }

  * { box-sizing: border-box; }

  html, body { margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--ink);
    font: 16px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 2rem 1rem 3rem;
  }

  h1 {
    margin: 0 0 0.25rem;
    font-size: clamp(1.5rem, 4vw, 2.25rem);
    letter-spacing: 0.02em;
  }

  p.lede {
    margin: 0 0 2rem;
    opacity: 0.75;
    text-align: center;
    max-width: 40ch;
  }

  .pizzas {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: clamp(1rem, 4vw, 3rem);
    width: 100%;
    max-width: 900px;
    justify-items: center;
  }
  @media (max-width: 640px) {
    .pizzas { grid-template-columns: 1fr; }
  }

  figure {
    margin: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0.75rem;
  }

  figcaption {
    font-weight: 600;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    font-size: 0.85rem;
  }

  .pizza {
    --size: min(70vw, 360px);
    width: var(--size);
    height: var(--size);
    border-radius: 50%;
    position: relative;
    background:
      radial-gradient(circle at 50% 50%,
        var(--cheese) 0 60%,
        var(--sauce) 60% 86%,
        var(--crust-inner) 86% 92%,
        var(--crust-outer) 92% 100%);
    box-shadow:
      0 12px 28px rgba(0, 0, 0, 0.18),
      inset 0 0 0 2px rgba(0, 0, 0, 0.05);
  }

  /* Subtle baked texture on the crust */
  .pizza::before {
    content: "";
    position: absolute;
    inset: 0;
    border-radius: 50%;
    background:
      radial-gradient(circle at 20% 25%, rgba(0,0,0,0.08) 0 4px, transparent 5px),
      radial-gradient(circle at 80% 30%, rgba(0,0,0,0.08) 0 3px, transparent 4px),
      radial-gradient(circle at 30% 80%, rgba(0,0,0,0.08) 0 5px, transparent 6px),
      radial-gradient(circle at 75% 78%, rgba(0,0,0,0.08) 0 4px, transparent 5px);
    pointer-events: none;
  }

  /* Toppings layer */
  .topping {
    position: absolute;
    border-radius: 50%;
    transform: translate(-50%, -50%);
  }

  /* --- Pepperoni pizza --- */
  .pep {
    width: 14%;
    height: 14%;
    background:
      radial-gradient(circle at 35% 35%,
        var(--pepperoni) 0 60%,
        var(--pepperoni-shade) 100%);
    box-shadow:
      inset 0 0 0 1px rgba(0,0,0,0.15),
      0 1px 2px rgba(0,0,0,0.25);
  }
  .pep::after {
    content: "";
    position: absolute;
    inset: 22% 22% 22% 22%;
    border-radius: 50%;
    background:
      radial-gradient(circle at 30% 30%,
        rgba(255,255,255,0.18) 0 30%,
        transparent 60%);
  }

  /* --- Margherita pizza --- */
  .mozz {
    width: 16%;
    height: 12%;
    background:
      radial-gradient(ellipse at 35% 30%,
        var(--mozz) 0 65%,
        var(--mozz-shade) 100%);
    box-shadow: inset 0 0 0 1px rgba(0,0,0,0.07);
  }

  .basil {
    width: 9%;
    height: 11%;
    background:
      radial-gradient(ellipse at 50% 40%,
        var(--basil) 0 60%,
        var(--basil-shade) 100%);
    border-radius: 60% 60% 60% 60% / 80% 80% 40% 40%;
    box-shadow: inset 0 -2px 0 rgba(0,0,0,0.18);
  }
  .basil::before {
    content: "";
    position: absolute;
    left: 50%;
    top: 8%;
    width: 6%;
    height: 80%;
    background: rgba(0,0,0,0.18);
    transform: translateX(-50%);
  }

  footer {
    margin-top: 2.5rem;
    font-size: 0.8rem;
    opacity: 0.55;
  }
</style>
</head>
<body>
  <h1>Two Pizzas</h1>
  <p class="lede">A self-contained HTML page — no external assets, just CSS.</p>

  <div class="pizzas">
    <figure aria-label="Pepperoni pizza">
      <div class="pizza" role="img" aria-label="Pepperoni pizza illustration">
        <span class="topping pep" style="left:35%;top:30%"></span>
        <span class="topping pep" style="left:62%;top:28%"></span>
        <span class="topping pep" style="left:50%;top:48%"></span>
        <span class="topping pep" style="left:30%;top:58%"></span>
        <span class="topping pep" style="left:68%;top:60%"></span>
        <span class="topping pep" style="left:42%;top:72%"></span>
        <span class="topping pep" style="left:60%;top:78%"></span>
      </div>
      <figcaption>Pepperoni</figcaption>
    </figure>

    <figure aria-label="Margherita pizza">
      <div class="pizza" role="img" aria-label="Margherita pizza illustration">
        <span class="topping mozz" style="left:36%;top:32%"></span>
        <span class="topping mozz" style="left:60%;top:30%"></span>
        <span class="topping mozz" style="left:50%;top:50%"></span>
        <span class="topping mozz" style="left:32%;top:62%"></span>
        <span class="topping mozz" style="left:66%;top:64%"></span>
        <span class="topping mozz" style="left:48%;top:76%"></span>

        <span class="topping basil" style="left:46%;top:38%"></span>
        <span class="topping basil" style="left:58%;top:56%;transform:translate(-50%,-50%) rotate(35deg)"></span>
        <span class="topping basil" style="left:38%;top:54%;transform:translate(-50%,-50%) rotate(-25deg)"></span>
        <span class="topping basil" style="left:55%;top:72%;transform:translate(-50%,-50%) rotate(15deg)"></span>
      </div>
      <figcaption>Margherita</figcaption>
    </figure>
  </div>

  <footer>Open this file directly in a browser — no server required.</footer>
</body>
</html>
